name: Auto Tag

on:
  push:
    branches:
      - main
      - develop
      - rc/**
    paths:
      - "samples/**"
      - "src/**"
      - "tests/**"

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Compute And Push Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate base semantic version
        id: semver
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE|!:)"
          minor_pattern: "^feat(\\(.+\\))?:"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Select final tag
        id: final
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          base="v${{ steps.semver.outputs.version }}"

          if [[ "$branch" == "main" ]]; then
            tag="$base"
          elif [[ "$branch" == "develop" ]]; then
            latest=$(git tag -l "${base}-beta.*" | sed -E "s/^${base}-beta\\.//" | sort -n | tail -1)
            next=$(( ${latest:-0} + 1 ))
            tag="${base}-beta.${next}"
          elif [[ "$branch" == rc/* ]]; then
            latest=$(git tag -l "${base}-rc.*" | sed -E "s/^${base}-rc\\.//" | sort -n | tail -1)
            next=$(( ${latest:-0} + 1 ))
            tag="${base}-rc.${next}"
          else
            echo "Unsupported branch '$branch'; skipping."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; skipping."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.final.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.final.outputs.tag }}"
          trigger_token="${{ secrets.RELEASE_TRIGGER_TOKEN }}"
          release_dispatched="false"

          if [[ -z "$trigger_token" ]]; then
            echo "RELEASE_TRIGGER_TOKEN is not configured. Falling back to GITHUB_TOKEN."
            git_remote_token="${{ github.token }}"
          else
            git_remote_token="$trigger_token"
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${git_remote_token}@github.com/${{ github.repository }}.git"
          git tag "$tag"
          git push origin "$tag"

          if [[ -z "$trigger_token" ]]; then
            echo "Dispatching release workflow because push events from GITHUB_TOKEN do not trigger workflows."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
              -f ref="$tag"
            release_dispatched="true"
          fi

          echo "Tag ${tag} created. release_dispatched=${release_dispatched}"
